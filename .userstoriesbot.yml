# Showcase fork only (never part of an upstream pull request).
version: 1
app:
  install: "npx -y bun@1.3.8 install && npx -y bun@1.3.8 run build:storybook"
  start: python3 -m http.server {port} --bind 0.0.0.0 --directory apps/storybook/storybook-static
  url: http://localhost:{port}
  readyPath: /iframe.html?id=components-datepicker--default&viewMode=story
  runtime: node22
  env:
    NODE_ENV: development
demo:
  maxVideos: 1
  beforePass: true
